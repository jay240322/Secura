name: Secura Security Scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    name: Secura Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: "PyYAML==6.0.3"

      - name: Verify PyYAML
        run: |
          python -c "import yaml; print('PyYAML:', yaml.__version__)"

      - name: Run Secura
        run: |
          python -m secura.scanner .

      - name: Upload Secura Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secura-security-report
          path: secura-report.json