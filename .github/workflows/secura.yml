name: Secura Security Scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    name: Secura Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: "PyYAML==6.0.3"

      - name: Verify PyYAML
        run: |
          python -c "import yaml; print('PyYAML:', yaml.__version__)"

      - name: Run Secura
        id: secura
        continue-on-error: true
        run: |
          python -m secura.scanner .

      - name: Publish GitHub Security Annotations
        if: always()
        run: |
          if [ -f secura-report.json ]; then
            python -m secura.github_annotations
          else
            echo "Secura report was not generated."
          fi

      - name: Fail if Secura security gate failed
        if: steps.secura.outcome == 'failure'
        run: |
          echo "Secura security gate failed."
          exit 1

      - name: Upload Secura Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secura-security-report
          path: secura-report.json